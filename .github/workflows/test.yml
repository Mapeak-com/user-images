name: API Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Start Application
      env:
        PORT: 3000
        STORAGE_DIR: ./data
        TEST_MODE: true
      run: |
        npm start &
        npx wait-on http://localhost:3000/health

    - name: Run HTTP Tests
      run: npm run test:http

  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the image
      run: docker build . -t mapeak/user-images

    - name: Run the image and check it serves
      run: |
        docker run -d --rm --name user-images -p 3000:3000 -e TEST_MODE=true mapeak/user-images
        npx wait-on http://localhost:3000/health
        docker stop user-images
